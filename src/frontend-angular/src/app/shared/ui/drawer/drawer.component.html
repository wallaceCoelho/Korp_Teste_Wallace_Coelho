@if (isVisible) {
  <div 
    class="fixed inset-0 z-50 overflow-hidden bg-slate-950/60 dark:bg-slate-950/80 backdrop-blur-sm transition-opacity duration-300 ease-in-out"
    [ngClass]="{
      'opacity-100 pointer-events-auto': isAnimatingIn,
      'opacity-0 pointer-events-none': !isAnimatingIn
    }"
    (click)="onBackdropClick()">
    
    <div 
      class="fixed inset-y-0 right-0 max-w-full flex pl-0 sm:pl-10"
      (click)="$event.stopPropagation()">
      
      <div 
        class="w-screen max-w-full sm:max-w-lg md:max-w-xl bg-white border-l border-slate-200 text-slate-900 dark:bg-slate-900 dark:border-slate-800 dark:text-slate-100 shadow-2xl flex flex-col transform transition-transform duration-300 ease-out"
        [ngClass]="{
          'translate-x-0': isAnimatingIn,
          'translate-x-full': !isAnimatingIn
        }">
        
        <!-- Header -->
        <div class="px-4 sm:px-6 py-4 sm:py-5 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between shrink-0">
          <div class="min-w-0 pr-2">
            <h3 class="text-lg sm:text-xl font-bold tracking-tight bg-gradient-to-r from-blue-600 to-indigo-600 dark:from-blue-400 dark:to-indigo-400 bg-clip-text text-transparent truncate">
              {{ title }}
            </h3>
            @if (subtitle) {
              <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5 truncate">{{ subtitle }}</p>
            }
          </div>
          
          <button 
            type="button" 
            (click)="close.emit()"
            class="w-9 h-9 flex items-center justify-center rounded-xl text-slate-500 hover:text-slate-900 hover:bg-slate-100 dark:text-slate-400 dark:hover:text-slate-100 dark:hover:bg-slate-800 transition-colors shrink-0">
            <lucide-icon name="x" class="w-5 h-5"></lucide-icon>
          </button>
        </div>

        <!-- Scrollable Content Body -->
        <div class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-6">
          <ng-content></ng-content>
        </div>

      </div>
    </div>

  </div>
}
