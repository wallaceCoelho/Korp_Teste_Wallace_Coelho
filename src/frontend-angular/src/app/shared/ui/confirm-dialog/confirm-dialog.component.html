@if (isOpen) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 dark:bg-slate-950/80 backdrop-blur-sm animate-fadeIn">
    <div 
      class="w-full max-w-md bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 space-y-4 shadow-2xl animate-scaleUp"
      (click)="$event.stopPropagation()">
      
      <!-- Top: Icon Badge + Title -->
      <div class="flex items-start gap-3.5">
        <div 
          [ngClass]="{
            'bg-rose-100 text-rose-600 dark:bg-rose-950/60 dark:text-rose-400': variant === 'danger',
            'bg-emerald-100 text-emerald-600 dark:bg-emerald-950/60 dark:text-emerald-400': variant === 'success',
            'bg-amber-100 text-amber-600 dark:bg-amber-950/60 dark:text-amber-400': variant === 'warning',
            'bg-blue-100 text-blue-600 dark:bg-blue-950/60 dark:text-blue-400': variant === 'primary'
          }"
          class="p-3 rounded-2xl shrink-0 flex items-center justify-center">
          <lucide-icon [name]="icon" class="w-6 h-6"></lucide-icon>
        </div>

        <div class="space-y-1 min-w-0 flex-1">
          <h3 class="text-base sm:text-lg font-bold text-slate-900 dark:text-slate-100">
            {{ title }}
          </h3>
          <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-300 leading-relaxed">
            {{ message }}
          </p>
        </div>
      </div>

      <!-- Optional Detail / Alert Box -->
      @if (detailMessage) {
        <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-950/60 border border-slate-200 dark:border-slate-800 text-xs text-slate-500 dark:text-slate-400 leading-relaxed font-mono">
          {{ detailMessage }}
        </div>
      }

      <!-- Action Buttons (Flat/Matte, No glowing shadows) -->
      <div class="flex items-center justify-end gap-3 pt-2">
        <button 
          type="button" 
          (click)="onCancel()"
          [disabled]="isLoading"
          class="px-4 py-2.5 rounded-xl text-slate-600 hover:text-slate-900 hover:bg-slate-100 dark:text-slate-400 dark:hover:text-slate-200 dark:hover:bg-slate-800 text-xs sm:text-sm font-semibold transition-colors disabled:opacity-50">
          {{ cancelText }}
        </button>

        <button 
          type="button" 
          (click)="onConfirm()"
          [disabled]="isLoading"
          [ngClass]="{
            'bg-rose-600 hover:bg-rose-500 text-white': variant === 'danger',
            'bg-emerald-600 hover:bg-emerald-500 text-white': variant === 'success',
            'bg-amber-600 hover:bg-amber-500 text-white': variant === 'warning',
            'bg-blue-600 hover:bg-blue-500 text-white': variant === 'primary'
          }"
          class="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition-all disabled:opacity-50 disabled:cursor-not-allowed">
          @if (isLoading) {
            <span class="w-3.5 h-3.5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
            <span>Processando...</span>
          } @else {
            <span>{{ confirmText }}</span>
          }
        </button>
      </div>

    </div>
  </div>
}
