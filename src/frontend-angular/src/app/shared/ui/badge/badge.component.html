<span 
  class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold tracking-wide uppercase border transition-colors"
  [ngClass]="{
    'bg-blue-500/15 text-blue-600 dark:text-blue-400 border-blue-500/30': variant === 'default',
    'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 border-emerald-500/30': variant === 'success',
    'bg-amber-500/15 text-amber-600 dark:text-amber-400 border-amber-500/30': variant === 'warning',
    'bg-rose-500/15 text-rose-600 dark:text-rose-400 border-rose-500/30': variant === 'danger',
    'bg-indigo-500/15 text-indigo-600 dark:text-indigo-400 border-indigo-500/30': variant === 'info',
    'border-slate-300 dark:border-slate-700 text-slate-600 dark:text-slate-400': variant === 'outline'
  }">
  <ng-content></ng-content>
</span>
