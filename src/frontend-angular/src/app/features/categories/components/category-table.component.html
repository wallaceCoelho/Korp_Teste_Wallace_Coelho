<div class="overflow-x-auto">
  <table class="w-full text-left text-xs sm:text-sm text-slate-700 dark:text-slate-300 min-w-[480px]">
    <thead class="bg-slate-100 text-[11px] sm:text-xs uppercase tracking-wider text-slate-600 border-b border-slate-200 dark:bg-slate-800/80 dark:text-slate-400 dark:border-slate-800">
      <tr>
        <th class="px-4 sm:px-5 py-3.5 font-semibold">Nome da Categoria</th>
        <th class="px-4 sm:px-5 py-3.5 font-semibold">Data de Criação</th>
        <th class="px-4 sm:px-5 py-3.5 font-semibold text-right">Ações</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-slate-200 dark:divide-slate-800/60">
      @for (category of categories; track category.id) {
        <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/30 transition-colors">
          <!-- Nome da Categoria -->
          <td class="px-4 sm:px-5 py-3.5 font-semibold text-slate-900 dark:text-slate-100 flex items-center gap-2">
            <lucide-icon name="tag" class="w-4 h-4 text-blue-600 dark:text-blue-400 shrink-0"></lucide-icon>
            <span class="truncate">{{ category.name }}</span>
          </td>

          <!-- Data de Criação -->
          <td class="px-4 sm:px-5 py-3.5 text-slate-600 dark:text-slate-400 whitespace-nowrap">
            {{ category.createdAt | date:'dd/MM/yyyy HH:mm' }}
          </td>

          <!-- Ações -->
          <td class="px-4 sm:px-5 py-3.5 text-right whitespace-nowrap">
            <div class="flex items-center justify-end gap-1.5">
              <button 
                type="button" 
                (click)="edit.emit(category)"
                class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-blue-50 text-blue-600 hover:bg-blue-100 dark:bg-blue-500/10 dark:text-blue-400 dark:hover:bg-blue-500/20 border border-blue-200 dark:border-blue-500/30 transition-colors text-xs font-semibold">
                <lucide-icon name="pencil" class="w-3.5 h-3.5"></lucide-icon>
                <span class="hidden sm:inline">Editar</span>
              </button>
              <button 
                type="button" 
                (click)="delete.emit(category.id)"
                class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-rose-50 text-rose-600 hover:bg-rose-100 dark:bg-rose-500/10 dark:text-rose-400 dark:hover:bg-rose-500/20 border border-rose-200 dark:border-rose-500/30 transition-colors text-xs font-semibold">
                <lucide-icon name="trash-2" class="w-3.5 h-3.5"></lucide-icon>
                <span class="hidden sm:inline">Excluir</span>
              </button>
            </div>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="3" class="px-5 py-8 text-center text-slate-500">
            Nenhuma categoria cadastrada ou encontrada.
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
