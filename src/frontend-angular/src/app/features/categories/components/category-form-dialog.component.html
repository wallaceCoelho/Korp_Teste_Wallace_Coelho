<app-drawer 
  [isOpen]="isOpen" 
  [title]="categoryToEdit ? 'Editar Categoria' : 'Cadastrar Nova Categoria'"
  subtitle="Informe o nome da categoria para organizar seu inventário"
  (close)="onClose()">
  
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">
    
    <!-- Nome -->
    <div>
      <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">
        Nome da Categoria *
      </label>
      <input 
        type="text" 
        formControlName="name"
        placeholder="Ex: Eletrônicos, Periféricos, Escritório"
        class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-300 text-slate-900 placeholder-slate-400 dark:bg-slate-950 dark:border-slate-800 dark:text-slate-100 dark:placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors text-sm" />
      @if (form.get('name')?.invalid && form.get('name')?.touched) {
        <p class="text-xs text-rose-500 dark:text-rose-400 mt-1">Nome da categoria é obrigatório.</p>
      }
    </div>

    <!-- Buttons Footer -->
    <div class="flex items-center justify-end gap-3 pt-6 border-t border-slate-200 dark:border-slate-800">
      <button 
        type="button" 
        (click)="onClose()"
        class="px-4 py-2.5 rounded-xl text-slate-600 hover:text-slate-900 hover:bg-slate-100 dark:text-slate-400 dark:hover:text-slate-200 dark:hover:bg-slate-800 transition-colors text-sm font-medium">
        Cancelar
      </button>

      <button 
        type="submit" 
        [disabled]="form.invalid || isSubmitting"
        class="px-6 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm transition-all disabled:opacity-50 disabled:cursor-not-allowed">
        {{ isSubmitting ? 'Salvando...' : (categoryToEdit ? 'Atualizar Categoria' : 'Cadastrar Categoria') }}
      </button>
    </div>

  </form>
</app-drawer>
