<div class="min-h-screen flex bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300">
  
  <!-- Retractable & Mobile Off-canvas Sidebar -->
  <app-sidebar 
    [isCollapsed]="isSidebarCollapsed()" 
    [isMobileOpen]="isMobileSidebarOpen()"
    (toggleCollapse)="toggleSidebar()"
    (closeMobile)="closeMobileSidebar()">
  </app-sidebar>

  <!-- Main Shell Area -->
  <div class="flex-1 flex flex-col min-w-0">
    
    <!-- Header -->
    <header class="h-16 sticky top-0 z-30 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 md:px-6 flex items-center justify-between transition-colors duration-300">
      
      <div class="flex items-center gap-3 min-w-0">
        <!-- Mobile Hamburger Toggle Button -->
        <button 
          type="button" 
          (click)="openMobileSidebar()"
          class="md:hidden p-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 dark:bg-slate-800 dark:hover:bg-slate-700 dark:text-slate-200 transition-colors shrink-0">
          <lucide-icon name="menu" class="w-5 h-5"></lucide-icon>
        </button>

        <h1 class="text-sm sm:text-base md:text-lg font-bold tracking-tight text-slate-900 dark:text-slate-100 truncate">
          Gestão de Produtos & Faturamento
        </h1>
      </div>

      <!-- Header Right Actions: Aspire Monitor & Dark/Light Mode Toggle -->
      <div class="flex items-center gap-2 shrink-0">
        <!-- Aspire Dashboard Monitor Button -->
        <button 
          type="button" 
          (click)="openMonitor()"
          title="Abrir Dashboard de Telemetria e Monitoramento (.NET Aspire)"
          class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-amber-200 bg-amber-50/80 hover:bg-amber-100 text-amber-800 dark:border-amber-900/60 dark:bg-amber-950/40 dark:hover:bg-amber-900/60 dark:text-amber-300 transition-all text-xs font-semibold shadow-sm hover:scale-[1.01] active:scale-[0.99]">
          <lucide-icon name="server" class="w-4 h-4 text-amber-600 dark:text-amber-400"></lucide-icon>
          <span class="hidden xs:inline sm:inline">Monitor</span>
          <span class="px-1.5 py-0.2 rounded text-[10px] font-bold bg-amber-200/70 text-amber-900 dark:bg-amber-900 dark:text-amber-200 uppercase tracking-wider">
            Aspire
          </span>
        </button>

        <!-- Theme Toggle Button -->
        <button 
          type="button" 
          (click)="toggleTheme()"
          class="flex items-center gap-2 px-3 py-1.5 rounded-xl border border-slate-200 bg-slate-100 hover:bg-slate-200 text-slate-700 dark:border-slate-800 dark:bg-slate-800/60 dark:hover:bg-slate-800 dark:text-slate-200 transition-all text-xs font-semibold shadow-sm">
          @if (isDarkMode()) {
            <lucide-icon name="moon" class="w-4 h-4 text-indigo-400"></lucide-icon>
            <span class="hidden sm:inline">Dark Mode</span>
          } @else {
            <lucide-icon name="sun" class="w-4 h-4 text-amber-500"></lucide-icon>
            <span class="hidden sm:inline">Light Mode</span>
          }
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 p-4 sm:p-6 md:p-8 max-w-7xl w-full mx-auto min-w-0">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Toast Container -->
  <app-toast-container></app-toast-container>
</div>
